name: Build and Push WordPress Image

# Trigger:
#   - Manual: Actions tab → "Build and Push WordPress Image" → Run workflow
#   - Tag push: any tag matching v* (e.g. v23-prod-split-layer-2026-08-20)
#
# Image goes to: ghcr.io/tuanmobiledev/wordpress-oscar
#
# This workflow runs on GitHub's runners (NOT the user's VPS) so it bypasses
# the VPS outbound bandwidth limit that caused docker push to stall on large
# layers. Public repo = free unlimited CI minutes + free GHCR storage.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v23-prod-split-layer-2026-08-20)'
        required: true
        default: 'v23-prod-split-layer-2026-08-20'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # tag push: use the tag name (strip leading "v")
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # workflow_dispatch: use the input
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag resolved: ${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.wp
          push: true
          tags: |
            ghcr.io/tuanmobiledev/wordpress-oscar:${{ steps.tag.outputs.version }}
            ghcr.io/tuanmobiledev/wordpress-oscar:latest
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify manifest exists
        run: |
          sleep 10
          echo "=== Verify manifest at GHCR ==="
          USER="${{ github.actor }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/tuanmobiledev/wordpress-oscar/manifests/${{ steps.tag.outputs.version }}")
          echo "manifest HTTP=${HTTP}"
          if [[ "${HTTP}" != "200" ]]; then
            echo "::error::Manifest not found at GHCR"
            exit 1
          fi
          echo "✓ Image successfully pushed to ghcr.io/tuanmobiledev/wordpress-oscar:${{ steps.tag.outputs.version }}"
